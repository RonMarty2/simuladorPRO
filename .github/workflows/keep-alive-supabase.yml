name: Keep Supabase alive

# El plan gratuito de Supabase pausa el proyecto tras ~7 dias sin actividad.
# Esta consulta liviana corre cada 2 dias para evitarlo.
# Requiere los secrets SUPABASE_URL y SUPABASE_ANON_KEY (Settings > Secrets > Actions).

on:
  schedule:
    - cron: '17 9 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la base
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/perfiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          # 2xx/4xx = la base respondio (RLS puede devolver 401/403); 5xx o 000 = caida/pausada
          if [ "$code" -ge 500 ] || [ "$code" -eq 0 ]; then exit 1; fi
